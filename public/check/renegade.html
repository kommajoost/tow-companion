<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Renegade V2 — controle</title>
<!--
  INTERNAL CHECK PAGE. Not linked from the app on purpose: it is a verification tool, not a feature.
    /check/renegade.html            → Dark Elves
    /check/renegade.html?army=skaven

  Everything on this page is DERIVED AT LOAD TIME from the same files the app itself fetches — the
  overlay, the OWB catalogue, and rules.json. Nothing is copied in or precomputed, so the page cannot
  drift away from what the app actually does. If a number here is wrong, the app is wrong too.

  It is deliberately an AUDIT, not a showcase: it re-checks the overlay's own `_was` values against the
  live catalogue and flags mismatches, and it states what the overlay does not touch.
-->
<style>
  :root {
    --paper: #14120e; --paper2: #1c1913; --line: #2e281d; --line-strong: #3d3626;
    --ink: #e8e0cd; --muted: #9a8f77; --faint: #6d6552;
    --gold: #d9b779; --gold-deep: #b9914d; --up: #d98b6a; --down: #86a97a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 22px 80px; background: var(--paper); color: var(--ink);
    font: 14px/1.55 ui-serif, Georgia, "Times New Roman", serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 21px; margin: 0 0 2px; font-weight: 700; letter-spacing: .01em; }
  h2 {
    font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-deep);
    margin: 34px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
    font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 600;
  }
  .sub { color: var(--muted); font-size: 11.5px; letter-spacing: .04em; }
  a { color: var(--gold); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
  .meta b { color: var(--ink); font-weight: 400; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 620px; }
  th {
    text-align: left; font: 600 8.5px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .18em;
    text-transform: uppercase; color: var(--faint); padding: 0 10px 7px 0; white-space: nowrap;
  }
  td { padding: 7px 10px 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
  tbody tr:nth-child(even) { background: rgba(255,255,255,.014); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cat { font: 600 8.5px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
  .up { color: var(--up); } .down { color: var(--down); }
  .rule { border-top: 1px solid var(--line); padding: 15px 0; }
  .rule h3 { margin: 0 0 3px; font-size: 15.5px; font-weight: 700; }
  .rule p { margin: 0 0 9px; max-width: 74ch; }
  .coverage {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 1px;
    background: var(--line); border: 1px solid var(--line); margin: 12px 0 8px;
  }
  .coverage > div { background: var(--paper2); padding: 10px 12px; }
  .coverage small {
    display: block; color: var(--faint); font: 600 8px/1.3 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .14em; text-transform: uppercase; margin-bottom: 3px;
  }
  .coverage strong { color: var(--ink); font-size: 18px; font-weight: 500; }
  .legend { display: flex; flex-wrap: wrap; gap: 7px 16px; margin: 10px 0 16px; color: var(--muted); font-size: 12px; }
  .swatch { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; }
  .swatch.changed { background: #6c9ce8; }
  .swatch.new { background: #d978c7; }
  .swatch.todo { background: #d9b779; }
  .source-group {
    margin: 24px 0 5px; color: var(--gold-deep); font: 600 9px/1.4 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .14em; text-transform: uppercase;
  }
  .source-block { border-top: 1px solid var(--line); padding: 11px 0 12px; }
  .source-block p { max-width: 92ch; margin: 0 0 6px; }
  .source-id {
    color: var(--faint); font: 500 8px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
    letter-spacing: .04em; margin-bottom: 5px;
  }
  .source-context {
    color: var(--muted); font: 11px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
    margin: -1px 0 8px; overflow-wrap: anywhere;
  }
  .source-table { min-width: 760px; font-size: 12.5px; }
  .source-table td { padding: 5px 8px; border: 1px solid var(--line); }
  .row-meta {
    display: block; margin-top: 3px; color: var(--gold-deep);
    font: 600 7.5px/1.25 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .11em; text-transform: uppercase;
  }
  .source-list { margin: 0; padding-left: 21px; max-width: 94ch; }
  .source-list li { margin: 0 0 5px; }
  .seg-changed { color: #8eb6f2; background: rgba(70, 118, 190, .12); }
  .seg-new { color: #e495d5; background: rgba(190, 76, 166, .12); }
  .seg-todo { color: #e6c983; background: rgba(190, 155, 68, .12); }
  .source-note {
    border: 1px solid var(--line-strong); background: var(--paper2); padding: 12px 14px;
    color: var(--muted); font-size: 12.5px; max-width: 92ch;
  }
  .badge {
    display: inline-block; font: 600 8.5px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .14em;
    text-transform: uppercase; padding: 3px 6px; border: 1px solid var(--gold-deep);
    color: var(--gold); border-radius: 2px; margin-left: 8px; vertical-align: 2px;
  }
  .flag { color: var(--up); font-size: 12px; }
  .note { color: var(--muted); font-size: 12.5px; max-width: 82ch; }
  button {
    font: 600 9px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase;
    background: none; border: 1px solid var(--line-strong); color: var(--gold); padding: 7px 11px;
    border-radius: 3px; cursor: pointer;
  }
  button:hover { border-color: var(--gold-deep); }
  .was { margin-top: 10px; padding: 11px 13px; background: var(--paper2); border-left: 2px solid var(--line-strong); }
  .was .lbl { font: 600 8.5px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); display: block; margin-bottom: 6px; }
  select { background: var(--paper2); color: var(--ink); border: 1px solid var(--line-strong); padding: 5px 8px; font: inherit; font-size: 12.5px; border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Renegade V2 — controle</h1>
  <div class="sub" id="who">laden…</div>
  <div class="meta" id="meta"></div>
  <div id="out"></div>
</div>

<script>
// army slug → the overlay's composition id. Same pairing as OVERLAY_BASE_ARMY in src/lib/overlays.ts;
// duplicated here because this page is deliberately standalone and does not import from the app.
const COMP = {
  'dark-elves': 'de-renegade-v2',
  'ogre-kingdoms': 'ok-renegade-v2',
  'skaven': 'sk-renegade-v2',
  'chaos-dwarfs': 'cd-renegade-v2',
  'daemons-of-chaos': 'doc-renegade-v2',
  'lizardmen': 'lm-renegade-v2',
};
const army = new URLSearchParams(location.search).get('army') || 'dark-elves';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const el = (id) => document.getElementById(id);

// A rule's text is stored as an array of paragraphs; render each as its own <p>.
const paras = (body) => (Array.isArray(body) ? body : [String(body)]).map((p) => `<p>${esc(p)}</p>`).join('');
const rich = (segments) => (segments || []).map((segment) => {
  const cls = segment.change ? ` class="seg-${esc(segment.change)}"` : '';
  let text = esc(segment.text).replace(/\n/g, '<br>');
  if (segment.italic) text = `<i>${text}</i>`;
  if (segment.bold) text = `<b>${text}</b>`;
  return `<span${cls}>${text}</span>`;
}).join('');

function sourceBlock(block) {
  const tableInfo = block.type === 'table'
    ? ` · ${esc(block.tableType)}${block.pointsBasis ? ` · ${esc(block.pointsBasis)}` : ''}`
    : '';
  const label = `<div class="source-id">${esc(block.id)} · ${esc(block.type)}${tableInfo} · ${block.changeKinds.map(esc).join(' + ')}</div>`;
  const path = Array.isArray(block.headingPath) && block.headingPath.length
    ? `<div>pad: ${block.headingPath.map(esc).join(' → ')}</div>`
    : '';
  const owner = block.unitContext?.name
    ? `<div>unit: <b>${esc(block.unitContext.name)}</b> · ${esc(block.unitContext.method)} · ${esc(block.unitContext.confidence)}</div>`
    : '<div>unit: — (legerbrede regel/compositie)</div>';
  const context = `<div class="source-context">${path}${owner}soort: ${esc(block.entryKind || block.tableType || block.type)}</div>`;
  if (block.type === 'heading') {
    return `<div class="source-block" id="source-${esc(block.id)}">${label}${context}<h3>${rich(block.segments)}</h3></div>`;
  }
  if (block.type === 'paragraph') {
    return `<div class="source-block" id="source-${esc(block.id)}">${label}${context}<p>${rich(block.segments)}</p></div>`;
  }
  if (block.type === 'list') {
    const items = block.items.map((item) => `<li>${rich(item.segments)}</li>`).join('');
    const tag = block.ordered ? 'ol' : 'ul';
    return `<div class="source-block" id="source-${esc(block.id)}">${label}${context}<${tag} class="source-list">${items}</${tag}></div>`;
  }
  const rowMeta = new Map((block.statlineRows || []).map((entry) => [entry.rowIndex, entry]));
  const rows = block.rows.map((row, rowIndex) => {
    const meta = rowMeta.get(rowIndex);
    return `<tr>${row.map((cell, cellIndex) => {
      const annotation = meta && cellIndex === 0
        ? `<span class="row-meta">${esc(meta.role)} · ${esc(meta.points.raw)} · ${esc(meta.points.basis)}</span>`
        : '';
      return `<td${cell.colspan > 1 ? ` colspan="${cell.colspan}"` : ''}${cell.rowspan > 1 ? ` rowspan="${cell.rowspan}"` : ''}>${rich(cell.segments)}${annotation}</td>`;
    }).join('')}</tr>`;
  }).join('');
  return `<div class="source-block" id="source-${esc(block.id)}">${label}${context}<div class="scroll"><table class="source-table"><tbody>${rows}</tbody></table></div></div>`;
}

async function main() {
  const comp = COMP[army];
  if (!comp) { el('who').textContent = `onbekende army "${army}"`; return; }

  const [overlay, cat, reference, review, coverage] = await Promise.all([
    fetch(`../renegade/${comp}.json`, { cache: 'no-store' }).then((r) => r.json()),
    fetch(`../owb/${army}.json`, { cache: 'no-store' }).then((r) => r.json()),
    fetch(`../renegade/${comp}-reference.json`, { cache: 'no-store' }).then((r) => r.json()),
    // Written by scripts/import-renegade-options.mjs. Absent is not an error — it only exists once that
    // importer has run for this pack.
    fetch(`../renegade/${comp}-review.json`, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
    fetch(`../renegade/${comp}-coverage.json`, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
  ]);

  // Flatten the catalogue by unit id, keeping EVERY occurrence. A unit can legitimately sit in more
  // than one category (War Hydra is both Special and Rare), and `applyOverlay` patches by id across all
  // of them — so showing only the first would under-report what the overlay actually touches.
  const units = {};
  for (const [category, arr] of Object.entries(cat)) {
    if (!Array.isArray(arr)) continue;
    for (const u of arr) {
      const e = units[u.id] || (units[u.id] = { name: u.name_en, at: [] });
      // The unit's own priceable options, one level of nesting included — the option table below needs
      // them to confirm that each patched name still exists on the unit.
      const opts = [];
      for (const g of ['equipment', 'armor', 'options', 'command', 'mounts']) {
        (u[g] || []).forEach((o) => {
          opts.push({ group: g, name: o.name_en, points: o.points });
          (o.options || []).forEach((s) => opts.push({ group: g, name: s.name_en, points: s.points }));
        });
      }
      e.at.push({ category, points: u.points, opts });
    }
  }
  for (const [category, arr] of Object.entries(overlay.addedUnits || {})) {
    if (!Array.isArray(arr)) continue;
    for (const u of arr) {
      const e = units[u.id] || (units[u.id] = { name: u.name_en, at: [] });
      const opts = [];
      for (const g of ['equipment', 'armor', 'options', 'command', 'mounts']) {
        (u[g] || []).forEach((o) => {
          opts.push({ group: g, name: o.name_en, points: o.points });
          (o.options || []).forEach((s) => opts.push({ group: g, name: s.name_en, points: s.points }));
        });
      }
      e.at.push({ category, points: u.points, opts });
    }
  }

  const picker = Object.keys(COMP).map((a) =>
    `<option value="${a}"${a === army ? ' selected' : ''}>${a}</option>`).join('');
  el('who').innerHTML = `<select id="army">${picker}</select>`;
  el('army').onchange = (e) => { location.search = `?army=${e.target.value}`; };

  el('meta').innerHTML = [
    ['pack', `${overlay.label} — ${reference.source.name}`],
    ['versie', reference.version ?? overlay.packVersion ?? '—'],
    ['status', overlay.status],
    ['scope', overlay.scope],
    ['bron', `<a href="${esc(reference.source.url)}" target="_blank" rel="noopener">${esc(reference.source.author)}</a>`],
  ].map(([k, v]) => `${k} <b>${v}</b>`).join('');

  let html = '';

  // ── complete source coverage ─────────────────────────────────────────────────────────────────
  // Generated from the Google Docs HTML, not from the partial app overlay. Every coloured source
  // segment and every uncoloured table cell around it are retained for auditing and implementation.
  html += `<h2>Brondekking — volledige draft</h2>
    <div class="coverage">
      <div><small>documentblokken</small><strong>${reference.stats.totalBlocks}</strong></div>
      <div><small>afwijkende blokken</small><strong>${reference.stats.armyListChangedBlocks}</strong></div>
      <div><small>blauwe segmenten</small><strong>${reference.stats.changedSegments}</strong></div>
      <div><small>magenta segmenten</small><strong>${reference.stats.newSegments}</strong></div>
      <div><small>gele todo-segmenten</small><strong>${reference.stats.todoSegments}</strong></div>
    </div>
    <div class="legend">
      <span><i class="swatch changed"></i>afwijkend van de officiële Legacy PDF</span>
      <span><i class="swatch new"></i>nieuw sinds de vorige Renegade-draft</span>
      <span><i class="swatch todo"></i>nog incompleet/in ontwikkeling</span>
    </div>
    <p class="note">De machineleesbare bron bevat ook alle ongewijzigde tekst en tabellen:
      <a href="../renegade/${esc(comp)}-reference.json">open ${esc(comp)}-reference.json</a>.
      De lijst onderaan toont ieder gemarkeerd bronblok uit de eigenlijke army list.</p>`;

  // ── units ──────────────────────────────────────────────────────────────────────────────────────
  // `_was` is what the base cost WHEN THE OVERLAY WAS GENERATED. Re-checking it against the live
  // catalogue is the point of this table: `npm run sync-owb` can move a base price, and then the
  // overlay is quietly claiming a change that is no longer the real change.
  const rows = Object.entries(overlay.units).filter(([, patch]) => typeof patch.points === 'number');
  const order = { characters: 0, core: 1, special: 2, rare: 3, mercenaries: 4, allies: 5 };
  const firstCat = (u) => (u && u.at.length ? u.at[0].category : undefined);
  rows.sort((a, b) => {
    const ua = units[a[0]], ub = units[b[0]];
    return (order[firstCat(ua)] ?? 9) - (order[firstCat(ub)] ?? 9)
      || String(ua ? ua.name : a[0]).localeCompare(String(ub ? ub.name : b[0]));
  });
  let stale = 0;
  html += `<h2>Unitprijsaanpassingen — ${rows.length}</h2><div class="scroll"><table><thead><tr>
    <th>categorie</th><th>unit</th><th class="num">basis</th><th class="num">RV2</th>
    <th class="num">verschil</th><th>controle</th></tr></thead><tbody>`;
  for (const [id, patch] of rows) {
    const u = units[id];
    const d = patch.points - patch._was;
    // The overlay stores points per MODEL for multi-model units, exactly as the catalogue does.
    let check = '<span style="color:var(--faint)">✓</span>';
    if (!u) {
      check = '<span class="flag">⚠ unit-id bestaat niet in de catalogue</span>';
      stale++;
    } else {
      // An occurrence already showing the patched price is fine — that is the app having applied the
      // overlay. Anything else means `_was` no longer describes the base and the claimed delta is wrong.
      const bad = u.at.filter((o) => o.points !== patch._was && o.points !== patch.points);
      if (bad.length) {
        check = `<span class="flag">⚠ basis is nu ${bad.map((o) => `${o.points} (${o.category})`).join(', ')}, overlay ging uit van ${patch._was}</span>`;
        stale++;
      }
    }
    const cats = u ? [...new Set(u.at.map((o) => o.category))] : [];
    html += `<tr>
      <td class="cat">${esc(cats.join(' + ')) || '—'}</td>
      <td>${esc(u ? u.name : id)}${cats.length > 1 ? ` <span class="sub">— in ${cats.length} categorieën, beide gepatcht</span>` : ''}</td>
      <td class="num" style="color:var(--muted)">${patch._was}</td>
      <td class="num"><b>${patch.points}</b></td>
      <td class="num ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d}</td>
      <td>${check}</td></tr>`;
  }
  html += '</tbody></table></div>';
  html += `<p class="note" style="margin-top:9px">Punten zijn per model voor units met meerdere modellen, net als in de catalogue.
    ${stale ? `<span class="flag">${stale} regel(s) hierboven kloppen niet meer met de huidige basisdata.</span>`
            : 'Alle <i>basis</i>-waarden kloppen nog met de huidige catalogue.'}</p>`;

  // ── option prices ──────────────────────────────────────────────────────────────────────────────
  // Separate from the unit table because these are a different KIND of change: money spent on top of a
  // unit. They are patched by option NAME (indices shift when sync-owb regenerates the catalogue), so
  // this also re-checks that each name still exists on the unit — a name that has drifted applies
  // nothing, silently, and that is exactly what wants surfacing.
  const optRows = [];
  for (const [id, patch] of Object.entries(overlay.units)) {
    for (const o of patch.options || []) {
      const u = units[id];
      const live = u ? u.at.flatMap((x) => x.opts).find((c) => c.group === o.group && c.name === o.name_en) : null;
      optRows.push({ id, unit: u ? u.name : id, ...o, live });
    }
  }
  html += `<h2>Optieprijzen — ${optRows.length}</h2>`;
  if (!optRows.length) {
    html += '<p class="note">Dit pack wijzigt geen optieprijzen die de app kan toepassen.</p>';
  } else {
    html += `<div class="scroll"><table><thead><tr><th>unit</th><th>optie</th><th>groep</th>
      <th class="num">basis</th><th class="num">RV2</th><th class="num">verschil</th><th>controle</th></tr></thead><tbody>`;
    for (const r of optRows) {
      const basis = typeof r._was === 'number' ? r._was : r.live?.points;
      const d = typeof r.points === 'number' && typeof basis === 'number' ? r.points - basis : null;
      const check = r.action === 'upsert' && !r.live
        ? '<span style="color:var(--faint)">✓ wordt toegevoegd</span>'
        : r.action === 'remove' && r.live
          ? '<span style="color:var(--faint)">✓ wordt verwijderd</span>'
          : r.live
            ? '<span style="color:var(--faint)">✓</span>'
            : '<span class="flag">⚠ doeloptie bestaat niet en de patch voegt haar niet toe</span>';
      html += `<tr><td>${esc(r.unit)}</td><td>${esc(r.name_en)}</td><td class="cat">${esc(r.group)}</td>
        <td class="num" style="color:var(--muted)">${basis ?? '—'}</td><td class="num"><b>${r.action === 'remove' ? 'verwijderd' : r.points ?? 'gewijzigd'}</b></td>
        <td class="num ${d > 0 ? 'up' : 'down'}">${d == null ? '—' : `${d > 0 ? '+' : ''}${d}`}</td><td>${check}</td></tr>`;
    }
    html += '</tbody></table></div>';
  }

  // ── rules ──────────────────────────────────────────────────────────────────────────────────────
  const addedRows = Object.entries(overlay.addedUnits || {}).flatMap(([category, list]) =>
    (list || []).map((unit) => ({ category, unit })));
  html += `<h2>Nieuwe units — ${addedRows.length}</h2>`;
  if (!addedRows.length) html += '<p class="note">Dit pack voegt geen nieuwe datasheets toe.</p>';
  else {
    html += '<div class="scroll"><table><thead><tr><th>categorie</th><th>unit</th><th class="num">punten</th><th>unit size</th><th>special rules</th></tr></thead><tbody>';
    for (const { category, unit } of addedRows) {
      html += `<tr><td class="cat">${esc(category)}</td><td>${esc(unit.name_en)}</td><td class="num">${unit.points ?? '—'}</td>
        <td>${esc(`${unit.minimum ?? 1}${unit.maximum ? `–${unit.maximum}` : '+'}`)}</td>
        <td>${esc(unit.specialRules?.name_en || '—')}</td></tr>`;
    }
    html += '</tbody></table></div>';
  }

  const compositionRows = Object.entries(overlay.composition?.sourceRules || {});
  html += `<h2>Compositieregels — ${compositionRows.reduce((total, [, rules]) => total + rules.length, 0)}</h2>`;
  for (const [section, clauses] of compositionRows) {
    html += `<div class="rule"><h3>${esc(section)}</h3>${paras(clauses)}</div>`;
  }

  if ((overlay.notes || []).length) {
    html += `<h2>Overige pack-bepalingen — ${overlay.notes.length}</h2><div class="rule">${paras(overlay.notes)}</div>`;
  }

  const profileRows = Object.entries(overlay.profiles || {});
  html += `<h2>V2-profielen — ${profileRows.length}</h2>`;
  if (profileRows.length) {
    html += '<div class="scroll"><table><thead><tr><th>unit/mount</th><th>troop type</th><th>profielrijen</th></tr></thead><tbody>';
    for (const [name, profile] of profileRows) {
      const metadata = [
        profile.baseSize && `base ${profile.baseSize}`,
        profile.armourValue && `armour ${profile.armourValue}`,
        ...(profile.equipment || []).map((value) => `equipment: ${value}`),
        ...(profile.specialRules || []).map((value) => `rule: ${value}`),
        ...(profile.notes || []).map((value) => `note: ${value}`),
      ].filter(Boolean).join(' · ');
      html += `<tr><td>${esc(name)}</td><td>${esc(profile.troopType || '—')}</td>
        <td>${esc([(profile.stats || []).map((row) => `${row.Name}: M${row.M} WS${row.WS} BS${row.BS} S${row.S} T${row.T} W${row.W} I${row.I} A${row.A} Ld${row.Ld}`).join(' · '), metadata].filter(Boolean).join(' · ') || '—')}</td></tr>`;
    }
    html += '</tbody></table></div>';
  }

  const itemRows = Object.entries(overlay.magicItems || {}).flatMap(([list, items]) =>
    (items || []).map((item) => ({ list, item })));
  html += `<h2>Magic items, gifts en disciplines — ${itemRows.length}</h2>`;
  if (itemRows.length) {
    html += '<div class="scroll"><table><thead><tr><th>lijst</th><th>naam</th><th>type</th><th class="num">punten</th><th>V2-tekst</th></tr></thead><tbody>';
    for (const { list, item } of itemRows) {
      const itemSlug = String(item.name || item.name_en).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      html += `<tr><td class="cat">${esc(list)}</td><td>${esc(item.name_en)}</td><td>${esc(item.type)}</td><td class="num">${item.points ?? '—'}</td>
        <td>${esc(overlay.magicItemText?.[itemSlug]?.body || '—')}</td></tr>`;
    }
    html += '</tbody></table></div>';
  }

  const loreRows = Object.entries(overlay.lores || {});
  html += `<h2>Gewijzigde spreukenlijsten — ${loreRows.length}</h2>`;
  if (loreRows.length) {
    html += '<div class="scroll"><table><thead><tr><th>lore</th><th>gewijzigde/nieuwe spreuken</th></tr></thead><tbody>';
    for (const [lore, patch] of loreRows) {
      html += `<tr><td>${esc(patch.name || lore)}</td><td>${esc((patch.spells || []).map((spell) => spell.name).join(' · '))}</td></tr>`;
    }
    html += '</tbody></table></div>';
  }

  const ruleEntries = Object.entries(overlay.rules || {});
  html += `<h2>Gewijzigde regels — ${ruleEntries.length}</h2>`;
  if (!ruleEntries.length) {
    html += '<p class="note">Dit pack wijzigt geen regeltekst die afwijkt van wat de app al heeft.</p>';
  }
  for (const [slug, r] of ruleEntries) {
    const badge = r.overrides
      ? `<span class="badge">vervangt ${esc(r.overrides)}</span>`
      : '<span class="badge">nieuw</span>';
    html += `<div class="rule"><h3>${esc(r.name_en)}${badge}</h3>${paras(r.body)}`;
    if (r.overrides) {
      html += `<button data-slug="${esc(r.overrides)}">toon de oorspronkelijke regel</button>
               <div class="was" id="was-${esc(slug)}" hidden></div>`;
    }
    html += '</div>';
  }

  // ── option lines NOT applied ────────────────────────────────────────────────────────────────────
  // Why these are worth a section of their own: an option price the importer could not act on is a price
  // the app still takes from the BASE catalogue, and that is invisible everywhere else in the app. Each
  // row carries the pack's own raw line so it can be read straight against the source document.
  if (review) {
    const REASON = {
      'exclusive-tier': 'Tier-optie. Het pack rekent tiers op elkaar door (+30 bóvenop Level 1), de catalogue absoluut (30 en 60). Zelfde kosten, andere basis — overnemen maakt de unit te goedkoop.',
      basis: 'Het pack noemt expliciet een andere basis (per model vs per unit) dan de catalogue. Niet vergelijkbaar.',
      ambiguous: 'Het label past op meer dan één optie van deze unit.',
    };
    const groups = [
      ['Geen optie met deze naam op de unit', review.unmatched || [],
        'Ofwel de catalogue benoemt het anders, ofwel het pack voegt een nieuwe optie toe. Deze prijzen komen in de app dus nog uit de basisdata.'],
      ['Bewust niet toegepast', review.refused || [],
        'Wél gematcht, maar overnemen zou het lijsttotaal fout maken. De reden staat per regel.'],
    ];
    const total = groups.reduce((n, g) => n + g[1].length, 0);
    html += `<h2>Optieregels die nog niet zijn doorgevoerd — ${total}</h2>`;
    html += `<p class="note">Wel toegepast: <b>${(review.applied || []).length}</b>.`
      + `${review.stats && review.stats.todoBlocksSkipped ? ` Daarnaast <b>${review.stats.todoBlocksSkipped}</b> blokken overgeslagen die het pack zelf als todo markeert.` : ''}`
      + ` De machineleesbare lijst staat in <b>${esc(comp)}-review.json</b>.</p>`;
    for (const [title, rows, why] of groups) {
      if (!rows.length) continue;
      const isRefused = rows === (review.refused || []);
      html += `<h3 style="font:600 10px/1.3 ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 4px">${esc(title)} — ${rows.length}</h3>`;
      html += `<p class="note" style="margin:0 0 9px">${esc(why)}</p>`;
      html += `<div class="scroll"><table><thead><tr><th>unit</th><th>label</th><th class="num">pack</th>`
        + `<th>bronregel</th>${isRefused ? '<th>reden</th>' : ''}</tr></thead><tbody>`;
      for (const r of rows) {
        html += `<tr><td>${esc(r.unit)}</td><td>${esc(r.label || r.option || '')}</td>`
          + `<td class="num"><b>${r.points}</b>${r.basis ? `<span class="sub">/${esc(r.basis)}</span>` : ''}`
          + `${typeof r.basePoints === 'number' ? `<span class="sub"> vs ${r.basePoints}</span>` : ''}</td>`
          + `<td style="max-width:46ch;color:var(--muted)">${esc(r.raw || '')}</td>`
          + (isRefused
            ? `<td style="max-width:40ch">${esc(REASON[r.reason] || r.reason || '')}${r.candidates ? ` <span class="sub">(${esc(r.candidates.join(' / '))})</span>` : ''}</td>`
            : '')
          + '</tr>';
      }
      html += '</tbody></table></div>';
    }
  }

  if (coverage) {
    const c = coverage.counts || {};
    const open = (c.unresolved || 0) + (c.unsupported || 0);
    html += `<h2>Implementatiedekking</h2>
      <div class="coverage">
        <div><small>automatisch toegepast</small><strong>${c.applied || 0}</strong></div>
        <div><small>gestructureerd vastgelegd</small><strong>${c.captured || 0}</strong></div>
        <div><small>onopgelost</small><strong>${c.unresolved || 0}</strong></div>
        <div><small>nog niet ondersteund</small><strong>${c.unsupported || 0}</strong></div>
        <div><small>bron-todo</small><strong>${c.todo || 0}</strong></div>
      </div>
      <p class="note">${open
        ? `<span class="flag">${open} gemarkeerde blokken hebben nog geen bevestigde implementatie.</span>`
        : 'Alle niet-todo bronblokken hebben een bevestigde implementatiestatus.'}
        De ledger staat in <a href="../renegade/${esc(comp)}-coverage.json">${esc(comp)}-coverage.json</a>.</p>`;
  }

  // ── every highlighted source block ─────────────────────────────────────────────────────────────
  const byId = new Map(reference.blocks.map((block) => [block.id, block]));
  const sourceBlocks = reference.armyListChangedBlockIds.map((id) => byId.get(id)).filter(Boolean);
  html += `<h2>Alle bronaanpassingen — ${sourceBlocks.length} blokken</h2>
    <div class="source-note">Dit is de complete extractie van de gekleurde bronwijzigingen, inclusief
    omliggende tabelcellen. Een blok op deze pagina is nog niet automatisch in de app geïmplementeerd.
    De tabellen hierboven tonen uitsluitend wat de huidige overlay al daadwerkelijk toepast.</div>`;
  let previousContext = '';
  for (const block of sourceBlocks) {
    const context = (block.headingPath || []).join(' · ');
    if (context && context !== previousContext) {
      html += `<div class="source-group">${esc(context)}</div>`;
      previousContext = context;
    }
    html += sourceBlock(block);
  }

  // ── implementation status ──────────────────────────────────────────────────────────────────────
  const remaining = coverage ? (coverage.counts.unresolved || 0) + (coverage.counts.unsupported || 0) : null;
  html += `<h2>Implementatiestatus</h2><p class="note">
    De bronextractie is volledig; de implementatie is ${remaining === 0 ? '<b>volledig bevestigd</b>' : '<b>nog niet volledig</b>'}.
    De actieve <b>${esc(comp)}</b>-overlay past momenteel ${rows.length} unitprijswijzigingen,
    ${optRows.length} optiemutaties en ${ruleEntries.length} afwijkende regelteksten toe.
    ${remaining == null ? '' : `Volgens de coverage-ledger staan nog <b>${remaining}</b> niet-todo blokken open.`}</p>`;

  el('out').innerHTML = html;

  // rules.json is ~15 MB, so it is fetched only when a comparison is actually asked for, and once.
  let rulesPromise = null;
  el('out').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-slug]');
    if (!btn) return;
    const box = btn.nextElementSibling;
    btn.disabled = true;
    btn.textContent = 'laden… (rules.json ≈ 15 MB)';
    rulesPromise = rulesPromise || fetch('../rules.json').then((r) => r.json());
    const data = await rulesPromise;
    const base = data.rules[btn.dataset.slug];
    box.hidden = false;
    box.innerHTML = `<span class="lbl">oorspronkelijk — ${esc(btn.dataset.slug)}</span>`
      + (base ? `<p>${esc(base.bodyIndex || '(geen tekst)')}</p>` : '<p class="flag">niet gevonden in rules.json</p>');
    btn.remove();
  });
}

main().catch((err) => { el('who').innerHTML = `<span style="color:var(--up)">laden mislukt: ${esc(err.message)}</span>`; });
</script>
</body>
</html>

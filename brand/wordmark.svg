<svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Battle Companion — Warhammer The Old World">
  <title>Battle Companion — wordmark</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#e9cd83"/>
      <stop offset="0.5" stop-color="#cda64f"/>
      <stop offset="1" stop-color="#a47d31"/>
    </linearGradient>
  </defs>

  <!-- comet glyph -->
  <g stroke="url(#gold)" stroke-linecap="round" fill="none">

  <!-- text lockup (uses Cinzel where available, serif fallback) -->
  <text x="166" y="58" font-family="Cinzel, Georgia, 'Times New Roman', serif" font-size="16" font-weight="600" letter-spacing="4.2" fill="#9c2b2b">WARHAMMER · THE OLD WORLD</text>
  <text x="164" y="108" font-family="Cinzel, Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" letter-spacing="0.5" fill="#1a1714">Battle Companion</text>
